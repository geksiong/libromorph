[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libromorph"
version = "1.0.0"
description = "Pandoc-powered publishing toolkit for converting Markdown folders into EPUBs and HTML websites."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "pillow>=9.0",
]

[project.scripts]
libromorph = "libromorph.cli:main"

[project.optional-dependencies]
music = [
    "playwright>=1.40",
]
diagrams = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libromorph*"]

[tool.setuptools.package-data]
libromorph = [
    "filters/*.lua",
    "templates/**/*",
    "themes/**/*",
]
